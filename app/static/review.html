<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review</title>
<style>
  :root {
    --bg: #f6f6f3;
    --surface: #ffffff;
    --text: #1d1d1f;
    --muted: #6a6a70;
    --border: #dcdcd6;
    --hover: #ecece6;
    --accent: #2457d6;
    --accent-text: #ffffff;
    --danger: #b42318;
    --fail-bg: #fde3e0;
    --fail-text: #8a1c12;
    --hard-bg: #ffe8c2;
    --hard-text: #6b3d00;
    --good-bg: #dcf2e1;
    --good-text: #1a5c2b;
    --shadow: 0 6px 24px rgba(0, 0, 0, .08);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416;
      --surface: #1e1e21;
      --text: #ececef;
      --muted: #a2a2aa;
      --border: #35353b;
      --hover: #2a2a2f;
      --accent: #7ea4ff;
      --accent-text: #0d1a33;
      --danger: #ff8a80;
      --fail-bg: #4a1f1b;
      --fail-text: #ffc9c2;
      --hard-bg: #4a3415;
      --hard-text: #ffdcaa;
      --good-bg: #183d24;
      --good-text: #bdeccb;
      --shadow: 0 6px 24px rgba(0, 0, 0, .4);
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; } /* beat .btn / grid display rules */
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 32px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .top a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .top a:hover { text-decoration: underline; }
  h1 { font-size: 1.25rem; margin: 0; }
  #remaining { color: var(--muted); font-size: .875rem; min-width: 4em; text-align: right; }
  .progress { height: 4px; background: var(--border); border-radius: 2px; margin: 12px 0 12px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }

  /* Settings */
  .settings { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 16px; font-size: .875rem; }
  .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .segmented button {
    font: inherit;
    border: 0;
    padding: 6px 12px;
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  .segmented button + button { border-left: 1px solid var(--border); }
  .segmented button[aria-pressed="true"] { background: var(--hover); color: var(--text); font-weight: 600; }
  .toggles { display: flex; gap: 14px; flex-wrap: wrap; }
  .toggles label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); cursor: pointer; }
  .toggles label.disabled { opacity: .5; cursor: default; }
  .toggles input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }

  .btn {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 10px;
    padding: 12px 20px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .btn.secondary { background: var(--hover); color: var(--text); }
  .btn:disabled { opacity: .6; cursor: progress; }

  /* Card */
  .flashcard {
    position: relative;
    min-height: min(46vh, 380px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 32px 20px;
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    cursor: pointer;
    user-select: none;
  }
  .flashcard.revealed, .flashcard.typing { cursor: default; user-select: text; }
  .flashcard.entering { animation: card-in .22s ease; }
  .flashcard.leaving { animation: card-out .18s ease forwards; }
  @keyframes card-in { from { opacity: 0; transform: translateX(24px); } }
  @keyframes card-out { to { opacity: 0; transform: translateX(-24px); } }
  .practice-badge {
    position: absolute;
    top: 12px; left: 12px;
    font-size: .75rem;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 999px;
    background: var(--hard-bg);
    color: var(--hard-text);
  }

  .word-row { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .french { font: 600 clamp(2rem, 9vw, 3rem)/1.15 Georgia, "Iowan Old Style", serif; margin: 0; overflow-wrap: anywhere; }
  .french .article { color: var(--muted); font-weight: 400; }
  .english { font-size: clamp(1.5rem, 6vw, 2rem); font-weight: 600; margin: 0; overflow-wrap: anywhere; }
  .hint-line { color: var(--muted); font-size: .875rem; margin: 0; }

  .audio-btn {
    width: 44px; height: 44px;
    flex: none;
    display: inline-grid;
    place-items: center;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
  }
  .audio-btn:hover { border-color: var(--accent); color: var(--accent); }
  .audio-btn.playing { border-color: var(--accent); color: var(--accent); animation: pulse 1s ease infinite; }
  .audio-btn.small { width: 32px; height: 32px; }
  .audio-btn svg { width: 50%; height: 50%; }
  .audio-btn.slow { font-size: 15px; line-height: 1; }
  .audio-pair { display: inline-flex; align-items: center; gap: 6px; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); } }

  /* Full width, so a typed-answer box can't push the card wider than the screen. */
  #front { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #front:empty { display: none; }
  .back { width: 100%; border-top: 1px solid var(--border); padding-top: 16px; margin-top: 4px; display: grid; gap: 10px; justify-items: center; animation: reveal .2s ease; }
  #front:empty + .back { border-top: 0; padding-top: 0; margin-top: 0; } /* Fill in shows only the back once revealed */
  @keyframes reveal { from { opacity: 0; transform: translateY(-6px); } }
  .back .french { font-size: clamp(1.75rem, 7vw, 2.4rem); }
  .back .english { font-size: 1.375rem; }
  .example { display: flex; align-items: center; justify-content: center; gap: 8px; }
  #example { font: italic 1.0625rem/1.5 Georgia, serif; color: var(--muted); margin: 0; }

  /* Fill in / Listen */
  .cloze-sentence { font: 1.35rem/1.6 Georgia, "Iowan Old Style", serif; margin: 0; overflow-wrap: anywhere; }
  .blank { display: inline-block; min-width: 4em; border-bottom: 2px solid var(--accent); margin: 0 .1em; }
  .base-hint { color: var(--muted); font-size: .85em; }
  .cloze-sentence mark { background: var(--good-bg); color: var(--good-text); border-radius: 4px; padding: 0 .15em; }
  .audio-btn.big { width: 76px; height: 76px; }
  .text-btn { font: inherit; font-size: .875rem; font-weight: 600; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; }
  .text-btn:hover { text-decoration: underline; }
  .card-word { margin: 0; font-size: .9375rem; color: var(--muted); }
  .card-word b { color: var(--text); font-family: Georgia, serif; }

  /* Typed answers */
  .answer-form { width: 100%; max-width: 360px; display: flex; gap: 8px; }
  .answer-form input {
    flex: 1;
    min-width: 0;
    font: 1.125rem Georgia, serif;
    font-size: max(16px, 1.125rem); /* avoids iOS zoom on focus */
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    text-align: center;
  }
  .answer-form input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .answer-form .btn { padding: 10px 16px; }
  .feedback { margin: 0; padding: 8px 12px; border-radius: 10px; font-size: .9375rem; font-weight: 600; }
  .feedback.good { background: var(--good-bg); color: var(--good-text); }
  .feedback.close { background: var(--hard-bg); color: var(--hard-text); }
  .feedback.bad { background: var(--fail-bg); color: var(--fail-text); }
  .feedback .typed { font-family: Georgia, serif; font-weight: 400; }

  /* Actions */
  .actions { margin-top: 16px; min-height: 132px; }
  #reveal { width: 100%; padding: 16px; font-size: 1.0625rem; }
  .ratings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  @media (min-width: 560px) { .ratings { grid-template-columns: repeat(6, 1fr); } }
  .rate {
    font: inherit;
    display: grid;
    gap: 2px;
    padding: 10px 4px;
    border: 2px solid transparent;
    border-radius: 10px;
    cursor: pointer;
  }
  .rate b { font-size: 1.25rem; line-height: 1.2; }
  .rate span { font-size: .75rem; }
  .rate.fail { background: var(--fail-bg); color: var(--fail-text); }
  .rate.hard { background: var(--hard-bg); color: var(--hard-text); }
  .rate.good { background: var(--good-bg); color: var(--good-text); }
  .rate:hover { border-color: currentColor; }
  .rate.suggested { border-color: currentColor; box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 25%, transparent); }
  .rate:disabled { opacity: .6; cursor: progress; }
  .rate:focus-visible, .btn:focus-visible, .audio-btn:focus-visible, .flashcard:focus-visible, .segmented button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #flash { min-height: 1.5em; margin: 12px 0 0; text-align: center; color: var(--muted); font-size: .875rem; }
  #flash.error { color: var(--danger); }
  .keys { display: none; text-align: center; color: var(--muted); font-size: .75rem; margin-top: 4px; }
  @media (hover: hover) and (pointer: fine) { .keys { display: block; } }
  kbd { font: inherit; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }

  /* Done / empty / loading */
  .panel { text-align: center; padding: 48px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
  .panel h2 { font-size: 1.5rem; margin: 0 0 8px; }
  .panel p { color: var(--muted); margin: 0 0 24px; }
  .done-icon { font-size: 2.5rem; margin-bottom: 8px; }
  .panel .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <a href="/">← Reader</a>
    <h1>Review</h1>
    <span id="remaining"></span>
  </header>
  <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>

  <div class="settings">
    <div class="segmented" role="group" aria-label="Mode">
      <button type="button" data-direction="fr-en" aria-pressed="true" title="See the French, recall the English">FR → EN</button>
      <button type="button" data-direction="en-fr" aria-pressed="false" title="See the English, recall the French">EN → FR</button>
      <button type="button" data-direction="cloze" aria-pressed="false" title="Fill the word into its example sentence">Fill in</button>
      <button type="button" data-direction="listen" aria-pressed="false" title="Hear it, type what you heard">Listen</button>
    </div>
    <div class="toggles">
      <label id="typed-label" title="Type the French instead of just revealing it (EN → FR and Fill in; Listen is always typed)">
        <input id="opt-typed" type="checkbox"> Type answer
      </label>
      <label title="Cards you miss (0–2) come back at the end of this session for practice. Practice ratings aren't saved.">
        <input id="opt-repeat" type="checkbox" checked> Repeat missed
      </label>
    </div>
  </div>

  <section id="loading" class="panel"><p>Loading cards…</p></section>

  <section id="session" hidden>
    <article id="card" class="flashcard" tabindex="0">
      <span id="practice-badge" class="practice-badge" hidden>Practice · not saved</span>
      <div id="front"></div>
      <div id="back" class="back" hidden></div>
    </article>

    <div class="actions">
      <button id="reveal" class="btn" type="button">Show answer</button>
      <div id="ratings" class="ratings" role="group" aria-label="How well did you remember?" hidden>
        <button class="rate fail" data-q="0" type="button" title="Complete blackout"><b>0</b><span>Blackout</span></button>
        <button class="rate fail" data-q="1" type="button" title="Incorrect, but remembered once seen"><b>1</b><span>Wrong</span></button>
        <button class="rate fail" data-q="2" type="button" title="Incorrect, but easy to remember"><b>2</b><span>Almost</span></button>
        <button class="rate hard" data-q="3" type="button" title="Correct with serious difficulty"><b>3</b><span>Hard</span></button>
        <button class="rate good" data-q="4" type="button" title="Correct after hesitation"><b>4</b><span>Good</span></button>
        <button class="rate good" data-q="5" type="button" title="Perfect recall"><b>5</b><span>Easy</span></button>
      </div>
    </div>
    <p id="flash" aria-live="polite"></p>
    <p id="keys" class="keys"></p>
  </section>

  <section id="done" class="panel" hidden>
    <div id="done-icon" class="done-icon" aria-hidden="true"></div>
    <h2 id="done-title"></h2>
    <p id="done-summary"></p>
    <div class="row">
      <a class="btn" href="/">Back to reader</a>
      <a class="btn secondary" href="/my-cards">My cards</a>
      <button id="check-again" class="btn secondary" type="button">Check again</button>
    </div>
  </section>
</main>

<script>
const $ = (sel) => document.querySelector(sel);
const card = $("#card");
const ratings = $("#ratings");
const revealBtn = $("#reveal");
const flash = $("#flash");
const player = new Audio();
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const ARTICLES = { m: "un", f: "une", mf: "un/une" };
const SPEAKER_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

// ---- Settings (remembered per browser) ----

const settings = { direction: "fr-en", typed: false, repeat: true };
try {
  Object.assign(settings, JSON.parse(localStorage.getItem("review-settings") ?? "{}"));
} catch {
  /* storage unavailable: use defaults */
}
function saveSettings() {
  try {
    localStorage.setItem("review-settings", JSON.stringify(settings));
  } catch {
    /* ignore */
  }
}
// The mode used for a card: "Fill in" needs an example sentence containing the word,
// so cards without one are asked EN → FR instead.
const modeFor = (c) => (settings.direction === "cloze" && !c.cloze ? "en-fr" : settings.direction);
// Listen is always typed; FR → EN never is (English answers are too free-form to check).
const isTyped = (m) => m === "listen" || (settings.typed && (m === "en-fr" || m === "cloze"));

function syncSettingsUI() {
  document.querySelectorAll("[data-direction]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.direction === settings.direction));
  const optional = settings.direction === "en-fr" || settings.direction === "cloze";
  $("#opt-typed").checked = settings.typed || settings.direction === "listen";
  $("#opt-typed").disabled = !optional;
  $("#typed-label").classList.toggle("disabled", !optional);
  $("#opt-repeat").checked = settings.repeat;
  $("#keys").innerHTML = isTyped(settings.direction)
    ? "<kbd>Enter</kbd> check, then <kbd>Enter</kbd> accept the suggested rating · <kbd>0</kbd>–<kbd>5</kbd> rate"
    : "<kbd>Space</kbd> reveal · <kbd>0</kbd>–<kbd>5</kbd> rate · <kbd>P</kbd> play · <kbd>S</kbd> slowly";
}

document.querySelectorAll("[data-direction]").forEach((btn) =>
  btn.addEventListener("click", () => {
    settings.direction = btn.dataset.direction;
    settingsChanged();
  }),
);
$("#opt-typed").addEventListener("change", (e) => {
  settings.typed = e.target.checked;
  settingsChanged();
});
$("#opt-repeat").addEventListener("change", (e) => {
  settings.repeat = e.target.checked;
  settingsChanged();
});
function settingsChanged() {
  saveSettings();
  syncSettingsUI();
  if (current && !revealed) showCard(); // re-draw the unanswered card in the new mode
}

// ---- Session state ----
// Queue items are {card, practice}. Practice items are repeats of cards missed this
// session: they're shown again but their ratings aren't sent to the server.

let queue = [];
let current = null; // queue[0] while it's on screen
let mode = "fr-en"; // how the current card is being asked (see modeFor)
let revealed = false;
let suggestion = null; // rating suggested by a typed answer
let busy = false;
let done = 0; // items finished this session (reviews + practice)
let reviewed = 0;
let lapses = 0;
let practiced = 0;

async function api(path, options = {}) {
  const resp = await fetch(path, {
    ...options,
    headers: options.body ? { "Content-Type": "application/json" } : undefined,
  });
  const body = await resp.json().catch(() => null);
  if (!resp.ok) {
    const detail = typeof body?.detail === "string" ? body.detail : `Request failed (${resp.status})`;
    throw Object.assign(new Error(detail), { status: resp.status });
  }
  return body;
}

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

function show(id) {
  for (const section of ["loading", "session", "done"]) $(`#${section}`).hidden = section !== id;
}

function setFlash(message, isError = false) {
  flash.textContent = message;
  flash.className = isError ? "error" : "";
}

function updateProgress() {
  const total = done + queue.length;
  $("#remaining").textContent = queue.length ? `${queue.length} left` : "";
  $("#progress-bar").style.width = total ? `${(done / total) * 100}%` : "0";
}

async function start() {
  show("loading");
  setFlash("");
  try {
    queue = (await api("/cards/due")).map((c) => ({ card: c, practice: false }));
  } catch (err) {
    $("#loading").querySelector("p").textContent = `Couldn't load cards: ${err.message}`;
    return;
  }
  showNext();
}

function showNext() {
  stopAudio();
  updateProgress();
  if (!queue.length) return finish();
  current = queue[0];
  showCard();
  show("session");
  card.classList.remove("entering");
  void card.offsetWidth; // restart the animation
  card.classList.add("entering");
}

// ---- Card faces ----

function frenchHeading(c) {
  const article = ARTICLES[c.gender];
  return el("h2", { className: "french", lang: "fr" },
    ...(article ? [el("span", { className: "article", textContent: `${article} ` })] : []),
    c.word,
  );
}

function audioButton(text, label, size = "") {
  const btn = el("button", { type: "button", className: `audio-btn ${size}` });
  btn.innerHTML = SPEAKER_ICON;
  btn.setAttribute("aria-label", label);
  btn.addEventListener("click", (e) => {
    e.stopPropagation(); // don't also reveal the card
    playAudio(text, btn);
  });
  return btn;
}

// 🔊 plus a 🐢 that plays the same audio spoken slowly.
function withSlow(normal, url, label) {
  const slow = audioButton(`${url}&speed=slow`, `${label} slowly`, "small slow");
  slow.textContent = "🐢";
  slow.title = "Play slowly";
  return el("span", { className: "audio-pair" }, normal, slow);
}
const audioPair = (url, label, size = "") => withSlow(audioButton(url, label, size), url, label);

const wordAudioUrl = (c) => c.audio_url; // includes the article for nouns
const sentenceAudioUrl = (text) => `/api/tts/fr?text=${encodeURIComponent(text)}`;

function answerForm(placeholder) {
  const input = el("input", {
    id: "answer", autocomplete: "off", autocapitalize: "off", spellcheck: false, lang: "fr", placeholder, ariaLabel: "Your answer",
  });
  const form = el("form", { className: "answer-form" }, input, el("button", { type: "submit", className: "btn", textContent: "Check" }));
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    checkTyped(input.value);
  });
  return form;
}

// "Je ___ (aller) au marché." — the base form is shown when the answer is an inflection.
function clozeSentence(c, revealAnswer) {
  const { before, answer, after } = c.cloze;
  const middle = revealAnswer
    ? [el("mark", { textContent: answer })]
    : [el("span", { className: "blank", ariaLabel: "blank" }),
       ...(normalizeAnswer(answer) !== normalizeAnswer(c.word) ? [el("span", { className: "base-hint", textContent: ` (${c.word})` })] : [])];
  return el("p", { className: "cloze-sentence", lang: "fr" }, before, ...middle, after);
}

function showCard() {
  const c = current.card;
  mode = modeFor(c);
  revealed = false;
  suggestion = null;
  card.classList.remove("revealed", "leaving", "typing");
  $("#practice-badge").hidden = !current.practice;
  $("#back").hidden = true;
  $("#back").replaceChildren();
  ratings.hidden = true;
  ratings.querySelectorAll(".suggested").forEach((b) => b.classList.remove("suggested"));
  const typed = isTyped(mode);

  const front = [];
  if (mode === "fr-en") {
    front.push(el("div", { className: "word-row" }, frenchHeading(c), audioPair(wordAudioUrl(c), "Play pronunciation")));
  } else if (mode === "en-fr") {
    front.push(el("p", { className: "english", textContent: c.translation }));
    const hint = c.gender ? "noun — include un / une" : c.word.includes(" ") ? "phrase" : "";
    if (hint) front.push(el("p", { className: "hint-line", textContent: hint }));
    if (settings.direction === "cloze") front.push(el("p", { className: "hint-line", textContent: "No example sentence for this card — translate it instead." }));
  } else if (mode === "cloze") {
    front.push(clozeSentence(c, false), el("p", { className: "hint-line", textContent: c.translation }));
  } else if (mode === "listen") {
    const play = audioButton(wordAudioUrl(c), "Play again", "big");
    const hintBtn = el("button", { type: "button", className: "text-btn", textContent: "Show a hint" });
    hintBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      hintBtn.replaceWith(el("p", { className: "hint-line", textContent: c.translation }));
    });
    front.push(withSlow(play, wordAudioUrl(c), "Play again"), el("p", { className: "hint-line", textContent: "Type what you hear" }), hintBtn);
    setTimeout(() => current?.card === c && !revealed && playAudio(wordAudioUrl(c), play, { quiet: true }), 250);
  }
  front.push(typed
    ? answerForm(mode === "cloze" ? "Fill in the blank…" : mode === "listen" ? "What did you hear?" : "Type the French…")
    : el("p", { className: "hint-line reveal-hint", textContent: mode === "fr-en" ? "Tap to reveal" : "Say it, then tap to reveal" }));
  $("#front").replaceChildren(...front);

  card.classList.toggle("typing", typed);
  revealBtn.hidden = typed;
  if (typed) $("#answer").focus({ preventScroll: true });
  else revealBtn.focus({ preventScroll: true });
}

function reveal(feedback = null) {
  if (!current || revealed) return;
  revealed = true;
  const c = current.card;
  const back = [];
  if (feedback) back.push(feedback);
  if (mode === "fr-en") {
    back.push(el("p", { className: "english", textContent: c.translation }));
  } else if (mode === "cloze") {
    back.push(el("div", { className: "word-row" }, clozeSentence(c, true), audioPair(sentenceAudioUrl(c.example_sentence), "Play sentence", "small")));
    back.push(el("p", { className: "card-word" }, el("b", { lang: "fr", textContent: c.word }), ` — ${c.translation}`));
  } else {
    back.push(el("div", { className: "word-row" }, frenchHeading(c), audioPair(wordAudioUrl(c), "Play pronunciation")));
    if (mode === "listen") back.push(el("p", { className: "english", textContent: c.translation }));
  }
  if (c.example_sentence && mode !== "cloze") {
    back.push(el("div", { className: "example" },
      el("p", { id: "example", lang: "fr", textContent: c.example_sentence }),
      audioPair(sentenceAudioUrl(c.example_sentence), "Play example sentence", "small"),
    ));
  }
  $("#back").replaceChildren(...back);
  $("#back").hidden = false;
  $("#front .reveal-hint")?.remove();
  $("#front .answer-form")?.remove();
  if (mode === "cloze") $("#front").replaceChildren(); // the back repeats the sentence with the answer filled in
  card.classList.add("revealed");
  revealBtn.hidden = true;
  ratings.hidden = false;
  ratings.querySelectorAll(".suggested").forEach((b) => b.classList.remove("suggested"));
  if (suggestion !== null) ratings.querySelector(`[data-q="${suggestion}"]`).classList.add("suggested");
}

// ---- Typed answers ----

const normalizeAnswer = (s) => s.normalize("NFC").replace(/[’ʼ‘]/g, "'").replace(/\s+/g, " ").trim().toLowerCase();
const stripAccents = (s) => s.normalize("NFD").replace(/\p{M}/gu, "").normalize("NFC");
const ARTICLE_RE = /^(?:(un|une|le|la|les)\s+|(l)')/;
const GENDER_ARTICLES = { m: ["un", "le"], f: ["une", "la"] };

// Levenshtein distance, for spotting one-letter slips ("pomme de tere").
function editDistance(a, b) {
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const row = [i];
    for (let j = 1; j <= b.length; j++) {
      row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = row;
  }
  return prev[b.length];
}

function checkAnswer(input, expectedWord, gender = null) {
  const expected = normalizeAnswer(expectedWord);
  let typed = normalizeAnswer(input);
  let article = null;
  const m = typed.match(ARTICLE_RE);
  if (m && !ARTICLE_RE.test(expected)) {
    article = m[1] ?? "l'";
    typed = typed.slice(m[0].length).trim();
  }
  const word = typed === expected ? "exact"
    : stripAccents(typed) === stripAccents(expected) ? "accents"
    : editDistance(stripAccents(typed), stripAccents(expected)) === 1 ? "typo"
    : "wrong";
  // l' and les don't show gender, so only judge un/une/le/la.
  let genderResult = null;
  if (GENDER_ARTICLES[gender] && article && !["l'", "les"].includes(article)) {
    genderResult = GENDER_ARTICLES[gender].includes(article) ? "right" : "wrong";
  }
  return { word, gender: genderResult, empty: !typed };
}

function checkTyped(input) {
  const c = current.card;
  // Fill in: the exact form in the sentence ("vais"), no gender. Otherwise the card's word.
  const expected = mode === "cloze" ? c.cloze.answer : c.word;
  const gender = mode === "cloze" ? null : c.gender;
  const result = checkAnswer(input, expected, gender);
  const article = ARTICLES[gender];
  const right = article && gender !== "mf" ? `${article} ${expected}` : expected;
  let cls;
  let text;
  if (result.empty) {
    [cls, text, suggestion] = ["bad", "No answer — here it is:", 0];
  } else if (mode === "cloze" && result.word !== "exact" && checkAnswer(input, c.word).word === "exact") {
    [cls, text, suggestion] = ["close", `That's the base form — here it needs “${expected}”. You typed `, 2];
  } else if (result.word === "typo") {
    [cls, text, suggestion] = ["close", "One letter off. You typed ", 2];
  } else if (result.word === "wrong") {
    [cls, text, suggestion] = ["bad", "Not quite. You typed ", 1];
  } else if (result.word === "accents") {
    [cls, text, suggestion] = ["close", "Almost — check the accents. You typed ", 3];
  } else if (result.gender === "wrong") {
    [cls, text, suggestion] = ["close", `Right word, wrong gender: it's ${right}. You typed `, 3];
  } else {
    [cls, text, suggestion] = ["good", result.gender === "right" ? "Correct, gender too!" : "Correct!", 4];
    if (article && gender !== "mf" && result.gender === null) text += ` Remember: ${right}.`;
  }
  const feedback = el("p", { className: `feedback ${cls}` }, text);
  if (cls !== "good" && !result.empty) feedback.append(el("span", { className: "typed", lang: "fr", textContent: `“${input.trim()}”` }));
  reveal(feedback);
}

// ---- Rating ----

async function rate(quality) {
  if (!revealed || busy) return;
  busy = true;
  const item = current;
  ratings.querySelectorAll("button").forEach((b) => (b.disabled = true));
  try {
    const repeat = settings.repeat && quality < 3;
    if (item.practice) {
      // Practice repeat: nothing is saved; keep it coming back until it's remembered.
      queue.shift();
      done++;
      practiced++;
      if (repeat) queue.push(item);
      setFlash(repeat ? `“${item.card.word}” will come round again.` : `“${item.card.word}” practised.`);
    } else {
      const updated = await api(`/cards/${item.card.id}/review`, {
        method: "POST",
        body: JSON.stringify({ quality }),
      });
      queue.shift();
      done++;
      reviewed++;
      if (quality < 3) lapses++;
      if (repeat) queue.push({ card: updated, practice: true });
      const days = updated.interval === 1 ? "tomorrow" : `in ${updated.interval} days`;
      setFlash(`“${updated.word}” comes back ${days}${repeat ? " — and once more for practice now" : ""}.`);
    }
    await leave();
  } catch (err) {
    if (err.status === 404) {
      // Deleted elsewhere: drop it and move on.
      queue.shift();
      setFlash("That card no longer exists — skipped.", true);
      await leave();
    } else {
      setFlash(`Couldn't save rating: ${err.message}`, true);
    }
  } finally {
    busy = false;
    ratings.querySelectorAll("button").forEach((b) => (b.disabled = false));
  }
}

async function leave() {
  card.classList.add("leaving");
  await sleep(reducedMotion.matches ? 0 : 180);
  showNext();
}

async function finish() {
  current = null;
  // Cards can come due while you review, so check once more before finishing.
  if (reviewed) {
    try {
      const more = await api("/cards/due");
      if (more.length) {
        queue = more.map((c) => ({ card: c, practice: false }));
        return showNext();
      }
    } catch {
      /* fall through to the done screen */
    }
  }
  $("#done-icon").textContent = reviewed ? "🎉" : "☕";
  if (reviewed) {
    const parts = [`${reviewed} card${reviewed === 1 ? "" : "s"} reviewed`, `${reviewed - lapses} remembered`];
    if (lapses) parts.push(`${lapses} to relearn tomorrow`);
    if (practiced) parts.push(`${practiced} practice repeat${practiced === 1 ? "" : "s"}`);
    $("#done-title").textContent = "All caught up!";
    $("#done-summary").textContent = parts.join(" · ");
  } else {
    $("#done-title").textContent = "Nothing due right now";
    $("#done-summary").textContent = "Save words from the reader, or come back when cards are due.";
  }
  $("#progress-bar").style.width = reviewed ? "100%" : "0";
  show("done");
  setFlash("");
}

// ---- Audio ----

// quiet: an automatic play (Listen mode) that the browser may block until the first tap.
function playAudio(url, btn, { quiet = false } = {}) {
  stopAudio();
  player.src = url;
  btn.classList.add("playing");
  const stop = () => btn.classList.remove("playing");
  player.onended = player.onerror = player.onpause = stop;
  player.play().catch(() => {
    stop();
    if (!quiet) setFlash("Couldn't play audio.", true);
  });
}

function stopAudio() {
  player.pause();
  document.querySelectorAll(".audio-btn.playing").forEach((b) => b.classList.remove("playing"));
}

// ---- Input ----

card.addEventListener("click", (e) => {
  if (!isTyped(mode) && !e.target.closest("button, input")) reveal();
});
revealBtn.addEventListener("click", () => reveal());
ratings.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-q]");
  if (btn) rate(Number(btn.dataset.q));
});
$("#check-again").addEventListener("click", () => {
  done = reviewed = lapses = practiced = 0;
  start();
});

document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey || $("#session").hidden) return;
  const target = e.target instanceof Element ? e.target : document.body;
  if (target.matches("input:not([type=checkbox]), textarea")) return; // typing an answer
  // Space/Enter on a focused button or checkbox should do that control's own thing.
  const onControl = target.matches("button, input");
  if (e.key.toLowerCase() === "p" || e.key.toLowerCase() === "s") {
    // Only present when the French is showing. S = slowly.
    card.querySelector(e.key.toLowerCase() === "s" ? ".audio-btn.slow" : ".audio-btn:not(.slow)")?.click();
  } else if (!revealed) {
    if ((e.key === " " || e.key === "Enter") && !isTyped(mode) && !onControl) {
      e.preventDefault();
      reveal();
    }
  } else if (/^[0-5]$/.test(e.key)) {
    rate(Number(e.key));
  } else if (e.key === "Enter" && suggestion !== null && !onControl) {
    e.preventDefault();
    rate(suggestion);
  }
});

syncSettingsUI();
start();
</script>
</body>
</html>
