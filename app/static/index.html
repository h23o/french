<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>French Reader</title>
<style>
  :root {
    --bg: #f6f6f3;
    --surface: #ffffff;
    --text: #1d1d1f;
    --muted: #6a6a70;
    --border: #dcdcd6;
    --hover: #ecece6;
    --accent: #2457d6;
    --accent-text: #ffffff;
    --known-bg: #d4eaff;
    --known-text: #0b3a66;
    --due-bg: #ffd49e;
    --due-text: #5e2f00;
    --phrase-known: #4f8fd6;
    --phrase-due: #e0892a;
    --range-bg: #d9e4ff;
    --danger: #b42318;
    --shadow: 0 10px 40px rgba(0, 0, 0, .14);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416;
      --surface: #1e1e21;
      --text: #ececef;
      --muted: #a2a2aa;
      --border: #35353b;
      --hover: #2a2a2f;
      --accent: #7ea4ff;
      --accent-text: #0d1a33;
      --known-bg: #18395a;
      --known-text: #d3e8ff;
      --due-bg: #5a3311;
      --due-text: #ffdcb3;
      --phrase-known: #6a9fe0;
      --phrase-due: #d9822e;
      --range-bg: #24345e;
      --danger: #ff8a80;
      --shadow: 0 10px 40px rgba(0, 0, 0, .5);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .layout { padding: 24px 16px 48px; transition: padding-right .2s ease; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .nav { display: flex; gap: 8px; }
  .review-link {
    flex: none;
    font-weight: 600;
    font-size: .9375rem;
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
  }
  .review-link:hover { border-color: var(--accent); }
  .review-link.has-due { background: var(--due-bg); border-color: var(--due-bg); color: var(--due-text); }
  .subtitle { color: var(--muted); margin: 0 0 20px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  textarea, input, select {
    width: 100%;
    font: inherit;
    font-size: 16px; /* avoids iOS zoom on focus */
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #text { min-height: 160px; resize: vertical; }

  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .btn {
    font: inherit;
    font-weight: 600;
    border: 0;
    border-radius: 8px;
    padding: 10px 18px;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  .btn:disabled { opacity: .6; cursor: progress; }
  .hint { color: var(--muted); font-size: .875rem; }
  .error { color: var(--danger); }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: .875rem; color: var(--muted); margin: 24px 0 8px; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
  .swatch.known { background: var(--known-bg); }
  .swatch.due { background: var(--due-bg); }

  #output {
    font: 1.25rem/1.9 Georgia, "Iowan Old Style", "Times New Roman", serif;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  #output:empty::before { content: "Your text will appear here."; color: var(--muted); font: 1rem system-ui, sans-serif; }
  #stats { margin: 0 0 8px; }

  .word {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    margin: 0;
    padding: 0; /* no padding, so "l'" + "homme" sit flush; highlights extend via box-shadow */
    line-height: 1.35;
    border-radius: 3px;
    cursor: pointer;
  }
  .word:hover { background: var(--hover); box-shadow: 0 0 0 2px var(--hover); }
  .word.known { background: var(--known-bg); box-shadow: 0 0 0 2px var(--known-bg); color: var(--known-text); }
  .word.due { background: var(--due-bg); box-shadow: 0 0 0 2px var(--due-bg); color: var(--due-text); }
  .word:focus-visible, .word.active { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Lookup panel: bottom sheet on phones, side panel on wide screens. */
  .panel {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-height: 60vh;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-top: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    box-shadow: var(--shadow);
    animation: sheet-in .2s ease;
    z-index: 10;
  }
  .panel[hidden] { display: none; }
  @keyframes sheet-in { from { transform: translateY(24px); opacity: 0; } }
  @keyframes panel-in { from { transform: translateX(24px); opacity: 0; } }
  @media (max-width: 899px) {
    /* Room to scroll the text above the sheet. */
    body.panel-open .layout { padding-bottom: 60vh; }
  }
  @media (min-width: 900px) {
    .panel {
      top: 0; left: auto;
      width: 400px;
      max-height: none;
      border-top: 0;
      border-left: 1px solid var(--border);
      border-radius: 0;
      animation-name: panel-in;
    }
    body.panel-open .layout { padding-right: 416px; }
  }

  .panel-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--border);
  }
  .panel-head h2 { margin: 0 0 4px; font: 600 1.5rem Georgia, serif; overflow-wrap: anywhere; }
  .icon-btn {
    font-size: 1.5rem;
    line-height: 1;
    width: 36px; height: 36px;
    flex: none;
    border: 0;
    border-radius: 8px;
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--hover); color: var(--text); }
  .badge { font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--hover); color: var(--muted); }
  .badge.known { background: var(--known-bg); color: var(--known-text); }
  .badge.due { background: var(--due-bg); color: var(--due-text); }

  .panel-body { overflow-y: auto; padding: 4px 16px 20px; }
  .panel-body h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
  .panel-body ol { margin: 0; padding-left: 20px; }
  .panel-body li { margin-bottom: 4px; }
  .examples { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .example {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
  }
  .example:hover { border-color: var(--accent); }
  .example.selected { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .example .fr { font-family: Georgia, serif; }
  .example .en { color: var(--muted); font-size: .9rem; }
  .credits { font-size: .75rem; color: var(--muted); margin-top: 12px; }
  .credits a { color: inherit; }

  #save-form { border-top: 1px solid var(--border); margin-top: 20px; padding-top: 16px; display: grid; gap: 10px; }
  #save-form[hidden] { display: none; }
  #save-form label { display: grid; gap: 4px; font-size: .875rem; font-weight: 600; }
  #save-form input, #save-form textarea, #save-form select { font-weight: 400; } /* don't inherit the bold label */

  .article { color: var(--muted); font-weight: 400; }

  /* Phrases: saved ones are underlined in the text; a selection in progress is tinted. */
  .phrase { border-bottom: 3px solid var(--phrase-known); padding-bottom: 1px; }
  .phrase.due { border-bottom-color: var(--phrase-due); }
  .swatch.phrase { background: none; border-bottom: 3px solid var(--phrase-known); border-radius: 0; height: 9px; }
  .word.in-range { background: var(--range-bg); box-shadow: 0 0 0 2px var(--range-bg); }
  #output.selecting .word { cursor: crosshair; }
  .output-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .output-bar #stats { margin: 0; }
  #phrase-hint { margin: 0 0 8px; }
  .chip {
    flex: none;
    font: inherit;
    font-size: .8125rem;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .phrase-link { margin: 12px 0 0; font-size: .875rem; color: var(--muted); }
  .phrase-link button {
    font: 600 1rem Georgia, serif;
    color: var(--accent);
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }
  .phrase-link button:hover { text-decoration: underline; }

  .heading-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .heading-row h2 { margin: 0; }
  .audio-btn {
    width: 32px; height: 32px;
    flex: none;
    display: inline-grid;
    place-items: center;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
  }
  .audio-btn:hover, .audio-btn.playing { border-color: var(--accent); color: var(--accent); }
  .audio-btn svg { width: 16px; height: 16px; }
  .back-btn {
    font: inherit;
    font-size: .875rem;
    font-weight: 600;
    color: var(--accent);
    background: none;
    border: 0;
    padding: 0;
    margin-bottom: 4px;
    cursor: pointer;
  }
  .back-btn:hover { text-decoration: underline; }
  .base-forms {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 10px;
    background: var(--known-bg);
    color: var(--known-text);
    display: grid;
    gap: 6px;
  }
  .base-title { margin: 0; font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .base-form {
    display: flex;
    align-items: baseline;
    gap: 8px;
    width: 100%;
    text-align: left;
    font: inherit;
    color: inherit;
    background: var(--surface);
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 6px 10px;
    cursor: pointer;
  }
  .base-form:hover { border-color: var(--accent); }
  .base-word { font: 600 1.125rem Georgia, serif; color: var(--text); }
  .base-desc { flex: 1; font-size: .8125rem; color: var(--muted); }
  .base-go { color: var(--accent); font-weight: 600; }
  #save-form textarea { min-height: 64px; resize: vertical; }
  #saved-note { border-top: 1px solid var(--border); margin: 20px 0 0; padding-top: 16px; }
</style>
</head>
<body>
<div class="layout">
  <main>
    <header class="top">
      <h1>French Reader</h1>
      <nav class="nav">
        <a class="review-link" href="/my-cards">My cards</a>
        <a id="review-link" class="review-link" href="/review">Review</a>
      </nav>
    </header>
    <p class="subtitle">Paste French text, then tap any word to look it up or save it.</p>

    <form id="reader-form" class="card">
      <textarea id="text" placeholder="Collez votre texte ici…" aria-label="French text" spellcheck="false"></textarea>
      <div class="row">
        <button id="submit" class="btn" type="submit">Read text</button>
        <span id="status" class="hint">Ctrl+Enter to submit</span>
      </div>
    </form>

    <div class="legend" aria-hidden="true">
      <span><span class="swatch known"></span>In your cards</span>
      <span><span class="swatch due"></span>Due for review</span>
      <span><span class="swatch phrase"></span>Saved phrase</span>
    </div>
    <section class="card">
      <div class="output-bar">
        <p id="stats" class="hint" hidden></p>
        <button id="phrase-btn" class="chip" type="button" aria-pressed="false" hidden
                title="Tap the first and last word of a phrase. On a computer you can also Shift+click.">Select phrase</button>
      </div>
      <p id="phrase-hint" class="hint" hidden></p>
      <div id="output" aria-live="polite"></div>
    </section>
  </main>
</div>

<aside id="panel" class="panel" hidden aria-labelledby="panel-word">
  <header class="panel-head">
    <div>
      <button id="panel-back" class="back-btn" type="button" hidden></button>
      <div class="heading-row">
        <h2 id="panel-word" lang="fr"></h2>
        <button id="panel-audio" class="audio-btn" type="button" aria-label="Play pronunciation">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        </button>
      </div>
      <span id="panel-badge" class="badge"></span>
    </div>
    <button id="panel-close" class="icon-btn" type="button" aria-label="Close">×</button>
  </header>
  <div class="panel-body">
    <p id="phrase-link" class="phrase-link" hidden></p>
    <div id="lookup"></div>
    <form id="save-form" hidden>
      <label>Translation
        <input id="save-translation" required autocomplete="off">
      </label>
      <label>Gender
        <select id="save-gender">
          <option value="">— (not a noun)</option>
          <option value="m">masculine · un</option>
          <option value="f">feminine · une</option>
          <option value="mf">either · un/une</option>
        </select>
      </label>
      <label>Example sentence
        <textarea id="save-example" placeholder="Optional — tap an example above to use it"></textarea>
      </label>
      <button id="save-btn" class="btn" type="submit">Save to Cards</button>
      <p id="save-error" class="error" hidden></p>
    </form>
    <p id="saved-note" hidden></p>
  </div>
</aside>

<script>
const $ = (sel) => document.querySelector(sel);
const textInput = $("#text");
const output = $("#output");
const panel = $("#panel");
const lookupBox = $("#lookup");
const saveForm = $("#save-form");

let currentText = "";
let displayText = ""; // currentText as rendered (NFC)
let tokens = [];
let spans = []; // [start, end] of each token in displayText, or null if not found
let activeRange = null; // {start, end} token indices highlighted for the open panel
let phraseMode = false; // "Select phrase": next two taps pick the first and last word
let phraseStart = null;
const lookupCache = new Map(); // normalized word -> lookup result or {error}
const player = new Audio();
const NEW_STATUS = { in_database: false, is_due: false, card_word: null, phrase: null };
const MAX_PHRASE_WORDS = 8;

function el(tag, props = {}, ...children) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

async function api(path, options = {}) {
  const resp = await fetch(path, {
    ...options,
    headers: options.body ? { "Content-Type": "application/json" } : undefined,
  });
  const body = await resp.json().catch(() => null);
  if (!resp.ok) {
    const detail = typeof body?.detail === "string" ? body.detail : `Request failed (${resp.status})`;
    throw Object.assign(new Error(detail), { status: resp.status });
  }
  return body;
}

function tokenState(tok) {
  return tok.is_due ? "due" : tok.in_database ? "known" : "";
}

async function refreshDueCount() {
  const link = $("#review-link");
  try {
    const due = (await api("/cards/due")).length;
    link.textContent = due ? `Review · ${due} due` : "Review";
    link.classList.toggle("has-due", due > 0);
  } catch {
    link.textContent = "Review";
  }
}
refreshDueCount();

// ---- Reading ----

$("#reader-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = textInput.value;
  if (!text.trim()) return;
  const btn = $("#submit");
  const status = $("#status");
  btn.disabled = true;
  status.className = "hint";
  status.textContent = "Processing…";
  try {
    await loadTokens(text);
    status.textContent = "Ctrl+Enter to submit";
  } catch (err) {
    status.className = "error";
    status.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

textInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("#reader-form").requestSubmit();
});

async function loadTokens(text) {
  tokens = await api("/api/process-text", { method: "POST", body: JSON.stringify({ text }) });
  if (text !== currentText) {
    activeRange = null;
    setPhraseMode(false);
  }
  currentText = text;
  render();
}

function render() {
  // The API returns words only, so find each one in the original text to keep
  // spacing, punctuation and line breaks. The tokenizer sees NFC text with curly
  // apostrophes straightened; that swap is one-for-one, so indices into `search`
  // line up with `display`.
  const display = (displayText = currentText.normalize("NFC"));
  const search = display.replace(/[’ʼ‘]/g, "'");
  const frag = document.createDocumentFragment();
  let target = frag; // the phrase <span> while inside a saved phrase
  let cursor = 0;
  spans = [];

  tokens.forEach((tok, i) => {
    const start = search.indexOf(tok.token, cursor);
    const btn = el("button", { type: "button", className: `word ${tokenState(tok)}` });
    btn.dataset.index = i;
    if (tok.card_word && tok.card_word.toLowerCase() !== tok.normalized) btn.title = `Form of your card “${tok.card_word}”`;
    if (start !== -1) target.append(display.slice(cursor, start));
    if (tok.phrase?.first) {
      target = el("span", { className: `phrase ${tok.phrase.is_due ? "due" : ""}`, title: `Saved phrase “${tok.phrase.card_word}”` });
      frag.append(target);
    }
    if (start === -1) {
      btn.textContent = tok.token;
      spans.push(null);
    } else {
      btn.textContent = display.slice(start, start + tok.token.length);
      spans.push([start, start + tok.token.length]);
      cursor = start + tok.token.length;
    }
    target.append(btn);
    if (tok.phrase?.last) target = frag;
  });
  frag.append(display.slice(cursor));
  output.replaceChildren(frag);
  markActive();
  $("#phrase-btn").hidden = tokens.length < 2;

  const unique = new Map(tokens.map((t) => [t.normalized, t]));
  const known = [...unique.values()].filter((t) => t.in_database).length;
  const due = [...unique.values()].filter((t) => t.is_due).length;
  const stats = $("#stats");
  stats.hidden = tokens.length === 0;
  stats.textContent = `${unique.size} unique words · ${known} in your cards · ${due} due`;
}

output.addEventListener("click", (e) => {
  const btn = e.target.closest("button.word");
  if (!btn) return;
  const index = Number(btn.dataset.index);
  if (phraseMode) {
    if (phraseStart === null) {
      phraseStart = index;
      activeRange = { start: index, end: index };
      markActive();
      setPhraseHint("Now tap the last word of the phrase.");
    } else {
      const start = phraseStart;
      setPhraseMode(false);
      openRange(start, index);
    }
  } else if (e.shiftKey && activeRange) {
    openRange(activeRange.start, index); // Shift+click extends the open word into a phrase
  } else {
    openRange(index, index);
  }
});

function markActive() {
  output.querySelectorAll(".word.active, .word.in-range").forEach((b) => b.classList.remove("active", "in-range"));
  if (!activeRange) return;
  const { start, end } = activeRange;
  for (let i = start; i <= end; i++) {
    output.querySelector(`[data-index="${i}"]`)?.classList.add(start === end ? "active" : "in-range");
  }
}

// ---- Phrase selection ----

$("#phrase-btn").addEventListener("click", () => setPhraseMode(!phraseMode));

function setPhraseMode(on) {
  phraseMode = on;
  phraseStart = null;
  const btn = $("#phrase-btn");
  btn.setAttribute("aria-pressed", on);
  btn.textContent = on ? "Cancel" : "Select phrase";
  output.classList.toggle("selecting", on);
  setPhraseHint(on ? "Tap the first word of the phrase." : "");
  if (on) {
    activeRange = null;
    markActive();
  }
}

function setPhraseHint(text, isError = false) {
  const hint = $("#phrase-hint");
  hint.textContent = text;
  hint.hidden = !text;
  hint.className = isError ? "error" : "hint";
}

// Same normalization as the server's normalize_word, so saved phrases match the text.
const normalizePhrase = (s) => s.normalize("NFC").replace(/[’ʼ‘]/g, "'").replace(/\s+/g, " ").trim().toLowerCase();

async function openRange(a, b) {
  const start = Math.min(a, b);
  const end = Math.max(a, b);
  if (end - start + 1 > MAX_PHRASE_WORDS) {
    setPhraseHint(`Phrases can be at most ${MAX_PHRASE_WORDS} words.`, true);
    return;
  }
  setPhraseHint("");
  activeRange = { start, end };
  markActive();
  if (start === end) return showWord(tokens[start].normalized, tokens[start], null);

  const phrase = spans[start] && spans[end]
    ? normalizePhrase(displayText.slice(spans[start][0], spans[end][1]))
    : normalizePhrase(tokens.slice(start, end + 1).map((t) => t.token).join(" "));
  const status = await wordStatus(phrase).catch(() => NEW_STATUS);
  if (activeRange?.start === start && activeRange?.end === end) showWord(phrase, status, null);
}

// ---- Lookup panel ----
// The panel shows one word at a time: the clicked token, or a base form reached
// from it ("belle" -> "beau"). `from` remembers the previous view for the back button.

const ARTICLES = { m: "un", f: "une", mf: "un/une" };
let view = null; // { word, status: {in_database, is_due, card_word}, from }

async function showWord(word, status, from) {
  const current = (view = { word, status, from, spoken: word });
  stopAudio();
  $("#panel-word").replaceChildren(word);
  const back = $("#panel-back");
  back.hidden = !from;
  if (from) back.textContent = `← ${from.word}`;
  updatePanelStatus(status, word);
  showPhraseLink(status, word);
  lookupBox.replaceChildren(el("p", { className: "hint", textContent: "Looking up…" }));
  saveForm.hidden = true;
  $("#save-error").hidden = true;
  panel.hidden = false;
  document.body.classList.add("panel-open");

  let result = lookupCache.get(word);
  if (!result) {
    try {
      result = await api(`/api/lookup/${encodeURIComponent(word)}`);
      lookupCache.set(word, result);
    } catch (err) {
      result = { error: err };
      if (err.status === 404) lookupCache.set(word, result); // don't cache outages
    }
  }
  if (view !== current) return; // another word was opened meanwhile
  renderLookup(result);
}

// Card status for a word or phrase that isn't a single token in the text (a base form, a selected phrase).
async function wordStatus(word) {
  const toks = await api("/api/process-text", { method: "POST", body: JSON.stringify({ text: word }) });
  if (toks.length === 1 && toks[0].normalized === word) return toks[0];
  const phrase = toks[0]?.phrase;
  if (toks.length > 1 && phrase && toks.every((t) => t.phrase?.card_id === phrase.card_id)) {
    return { in_database: true, is_due: phrase.is_due, card_id: phrase.card_id, card_word: phrase.card_word, phrase: null };
  }
  return NEW_STATUS;
}

async function openBaseForm(word) {
  const from = view;
  const status = await wordStatus(word).catch(() => NEW_STATUS);
  if (view === from) showWord(word, status, from);
}

// A word inside a saved phrase links to the phrase card.
function showPhraseLink(status, word) {
  const link = $("#phrase-link");
  const phrase = status.phrase;
  link.hidden = !phrase;
  if (!phrase) return;
  const btn = el("button", { type: "button", lang: "fr", textContent: `${phrase.card_word} →` });
  btn.addEventListener("click", () => {
    const index = tokens.indexOf(status);
    if (index !== -1) {
      let start = index;
      let end = index;
      while (!tokens[start].phrase.first) start--;
      while (!tokens[end].phrase.last) end++;
      activeRange = { start, end };
      markActive();
    }
    const phraseStatus = { in_database: true, is_due: phrase.is_due, card_id: phrase.card_id, card_word: phrase.card_word, phrase: null };
    showWord(normalizePhrase(phrase.card_word), phraseStatus, view);
  });
  link.replaceChildren(`“${word}” is part of your saved phrase `, btn);
}

function closePanel() {
  panel.hidden = true;
  document.body.classList.remove("panel-open");
  activeRange = null;
  markActive();
  stopAudio();
  view = null;
}

// ---- Audio ----

$("#panel-audio").addEventListener("click", () => {
  if (!view) return;
  const btn = $("#panel-audio");
  stopAudio();
  player.src = `/api/tts/fr?text=${encodeURIComponent(view.spoken)}`;
  btn.classList.add("playing");
  const done = () => btn.classList.remove("playing");
  player.onended = player.onerror = player.onpause = done;
  player.play().catch(done);
});

function stopAudio() {
  player.pause();
  $("#panel-audio").classList.remove("playing");
}

$("#panel-close").addEventListener("click", closePanel);
$("#panel-back").addEventListener("click", async () => {
  const from = view?.from;
  if (!from) return;
  // Re-check status: saving the base form may have made this word a known form.
  const status = await wordStatus(from.word).catch(() => from.status);
  showWord(from.word, status, from.from);
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (phraseMode) setPhraseMode(false);
  else if (!panel.hidden) closePanel();
});

function updatePanelStatus(status, word) {
  const badge = $("#panel-badge");
  const state = tokenState(status);
  badge.className = `badge ${state}`;
  badge.textContent = { due: "Due for review", known: "In your cards", "": "New word" }[state];

  const viaForm = status.card_word && status.card_word.toLowerCase() !== word;
  const note = $("#saved-note");
  note.hidden = !status.in_database;
  note.replaceChildren(
    viaForm ? "This is a form of your card " : `This ${word.includes(" ") ? "phrase" : "word"} is in your cards`,
    ...(viaForm ? [el("strong", { lang: "fr", textContent: status.card_word })] : []),
    status.is_due ? (viaForm ? ", which is due for review." : " and due for review.") : ".",
  );
}

function renderLookup(result) {
  const { word, status } = view;
  const parts = [];

  // No article on inflected forms: "une maisons" would be wrong.
  if (result.gender && result.definition) {
    $("#panel-word").replaceChildren(el("span", { className: "article", textContent: `${ARTICLES[result.gender]} ` }), word);
    if (result.gender !== "mf") view.spoken = `${ARTICLES[result.gender]} ${word}`; // hear the gender too
  }

  if (result.error) {
    parts.push(el("p", {
      className: result.error.status === 404 ? "hint" : "error",
      textContent: result.error.status === 404
        ? "No dictionary entry found. You can still save it with your own translation."
        : `Couldn't reach the dictionary: ${result.error.message}`,
    }));
  } else {
    if (result.base_forms.length) {
      parts.push(el("div", { className: "base-forms" },
        el("p", { className: "base-title", textContent: result.definition ? "Also a form of" : "Form of" }),
        ...result.base_forms.map((base) => {
          const btn = el("button", { type: "button", className: "base-form", title: `Look up ${base.word}` },
            el("span", { className: "base-word", lang: "fr", textContent: base.word }),
            el("span", { className: "base-desc", textContent: base.description }),
            el("span", { className: "base-go", textContent: "→", ariaHidden: "true" }),
          );
          btn.addEventListener("click", () => openBaseForm(base.word));
          return btn;
        }),
      ));
    }
    for (const meaning of result.meanings) {
      parts.push(
        el("h3", { textContent: meaning.part_of_speech }),
        el("ol", {}, ...meaning.definitions.map((d) => el("li", { textContent: d }))),
      );
    }
    if (result.examples.length) {
      parts.push(
        el("h3", { textContent: "Examples" }),
        el("ul", { className: "examples" }, ...result.examples.map((ex) => {
          const btn = el("button", { type: "button", className: "example", title: "Use as the card's example" },
            el("div", { className: "fr", textContent: ex.french }),
            el("div", { className: "en", textContent: ex.english }),
          );
          btn.addEventListener("click", () => selectExample(btn, ex.french));
          return el("li", {}, btn);
        })),
      );
    }
    parts.push(el("p", { className: "credits" },
      "Definitions: ",
      el("a", { href: `https://en.wiktionary.org/wiki/${encodeURIComponent(word)}`, target: "_blank", rel: "noopener", textContent: "Wiktionary" }),
      " (CC BY-SA). Examples: ",
      el("a", { href: "https://tatoeba.org", target: "_blank", rel: "noopener", textContent: "Tatoeba" }),
      " (CC BY).",
    ));
  }
  lookupBox.replaceChildren(...parts);

  if (!status.in_database) {
    const translation = $("#save-translation");
    translation.value = result.definition ?? "";
    // An inflected form ("belle") usually makes a worse card than its base form ("beau").
    const base = !result.definition && result.base_forms?.[0];
    translation.placeholder = base ? `Tip: save “${base.word}” instead (above)` : "";
    $("#save-gender").value = result.gender ?? "";
    $("#save-example").value = "";
    const first = lookupBox.querySelector(".example");
    if (first) selectExample(first, result.examples[0].french);
    $("#save-btn").textContent = `Save “${word}” to Cards`;
    saveForm.hidden = false;
  }
}

function selectExample(btn, french) {
  lookupBox.querySelectorAll(".example.selected").forEach((b) => b.classList.remove("selected"));
  btn.classList.add("selected");
  $("#save-example").value = french;
}

saveForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const saving = view;
  const btn = $("#save-btn");
  const label = btn.textContent;
  const error = $("#save-error");
  btn.disabled = true;
  btn.textContent = "Saving…";
  error.hidden = true;
  try {
    await api("/cards/", {
      method: "POST",
      body: JSON.stringify({
        word: saving.word,
        translation: $("#save-translation").value.trim(),
        example_sentence: $("#save-example").value.trim() || null,
        gender: $("#save-gender").value || null,
      }),
    });
    // Refresh highlights: every occurrence, plus any inflected forms of the new card.
    await loadTokens(currentText);
    refreshDueCount();
    if (view === saving) {
      saving.status = await wordStatus(saving.word).catch(() => saving.status);
      saveForm.hidden = true;
      updatePanelStatus(saving.status, saving.word);
      $("#saved-note").textContent = `Saved “${saving.word}” to your cards.`;
    }
  } catch (err) {
    error.textContent = err.message;
    error.hidden = false;
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
});
</script>
</body>
